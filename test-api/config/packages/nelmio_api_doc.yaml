nelmio_api_doc:
    documentation:
        info:
            title: API de Investimentos
            description: >
                API REST para gerenciamento de investimentos.<br>
                Permite: criar investidor, criar investimento, visualizar investimento, resgatar investimento e listar os investimentos de um investidor.
            version: 1.0.0
    areas: # to filter documented areas
        path_patterns:
            - ^/api(?!/doc$) # Accepts routes under /api except /api/doc
